# API gateway: path routing, request IDs, basic rate limiting.
# JWTs are verified inside each service, not here.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# The same keys the services log, so one request_id finds the request in every container.
log_format json escape=json '{"ts": "$time_iso8601", "service": "gateway", "request_id": "$req_id", '
                            '"method": "$request_method", "path": "$uri", "status": $status, '
                            '"duration_ms": $request_time}';

server {
    listen 80;
    access_log /dev/stdout json;
    client_max_body_size 5m;

    # Docker's DNS. Using variables in proxy_pass means nginx starts (and keeps
    # running) even when a service container is stopped, e.g. in failure demos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Service-Token   "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    add_header X-Request-ID $req_id always;

    location ~ ^/api/(admin|catalog|inventory|order|analytics)/internal(/|$) {
        default_type application/json;
        return 404 '{"error": {"code": "NOT_FOUND", "message": "Unknown API path", "details": {}}}';
    }

    # /api/<service>/<path>  ->  http://<service>:8000/<path>  (prefix stripped)
    location ~ ^/api/(admin|catalog|inventory|order|analytics)(/.*)?$ {
        limit_req zone=api burst=60 nodelay;
        set $svc $1;
        set $rest $2;
        if ($rest = "") { set $rest "/"; }
        proxy_pass http://$svc:8000$rest$is_args$args;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error": {"code": "NOT_FOUND", "message": "Unknown API path", "details": {}}}';
    }

    location / {
        set $web web;
        proxy_pass http://$web:80;
    }
}
