[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-common"
version = "0.1.0"
description = "Shared code for the retail services: auth, outbox, Kafka consumer, envelope, health."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.15,<4",
  "psycopg[binary]>=3.2,<4",
  "dj-database-url>=2.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "confluent-kafka>=2.6,<3",
  "gunicorn>=23,<24",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
]

[tool.setuptools.packages.find]
include = ["retail_common*"]
